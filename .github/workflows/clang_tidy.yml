name: clang-tidy

# Runs clang-tidy, with the checks in .clang-tidy, over the C++ lines a pull
# request changes (scripts/clang_tidy_diff.py). The compile database is
# configured without the precompiled header, so code that only builds because
# the PCH supplied an include fails here.
#
# No paths filter: the job is a required check, and a workflow skipped by a
# paths filter leaves a required check pending forever. A PR with no C++
# changes finishes after its first check.
#
# A PR that changes deps/ needs the deps Build all builds from it, so this job
# leaves it to the clang-tidy job in build_deps.yml. Both decide from the same
# merge commit, so each PR is checked by exactly one of them.
on:
  push:
    branches:
      - ci/clang-tidy-split-harness

permissions:
  contents: read

concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: true

jobs:
  clang_tidy:
    # Branch protection requires this check by name. Renaming the job disables
    # that gate.
    name: clang-tidy
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          # The PR merge commit plus its first parent, the base it is diffed against.
          fetch-depth: 2
          # Enough to see whether this job checks the PR. The action checks out
          # the rest when it does.
          sparse-checkout: |
            .github
            deps
          filter: blob:none

      # A PR that leaves deps/ alone has main's deps, so it may fall back to an
      # older cache while main's own build of a new deps/ is running. The key
      # must match the one build_check_cache.yml builds for x86_64 Linux.
      - name: Run clang-tidy
        uses: ./.github/actions/clang-tidy
        with:
          deps-change: 'false'
          cache-key: linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}
          restore-keys: linux-clang-cache-orcaslicer_deps-build-
          apt-install: ${{ !vars.SELF_HOSTED }}
