name: clang-tidy

# Runs clang-tidy, with the checks in .clang-tidy, over the C++ lines a pull
# request changes (scripts/clang_tidy_diff.py). The compile database is
# configured without the precompiled header, so code that only builds because
# the PCH supplied an include fails here.
#
# No paths filter: the job is a required check, and a workflow skipped by a
# paths filter leaves a required check pending forever. A PR with no C++
# changes finishes after the first step.
on:
  push:
    branches:
      - ci/clang-tidy-deps-wait-harness

permissions:
  contents: read
  # Waiting for the deps cache reads the cache and workflow run APIs.
  actions: read

concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: true

jobs:
  clang_tidy:
    # Branch protection requires this check by name. Renaming the job disables
    # that gate.
    name: clang-tidy
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          # The PR merge commit plus its first parent, the base it is diffed against.
          fetch-depth: 2

      - name: Look for changed C++ files
        id: changes
        run: |
          if git -c core.quotePath=false diff --name-only HEAD^1 -- src tests | grep -qE '\.(cpp|cc|cxx|hpp|h|hxx)$'; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "No C++ changes under src/ or tests/."
          fi

      # Only the cache built from this deps/ will do: any other one has the wrong
      # dependency headers. Build all's amd64 build_linux Build Deps job saves it,
      # on main, or on this PR when main does not have it yet. There are no
      # restore-keys, because a prefix match on this PR's ref would win over the
      # exact key on main.
      - name: Restore cached deps
        id: deps_cache
        if: steps.changes.outputs.cpp == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      # Waiting holds the runner, and a self-hosted server may be the one that has
      # to build the deps, so there the check fails at once.
      - name: Wait for Build all to save the deps cache
        if: steps.changes.outputs.cpp == 'true' && steps.deps_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.deps_cache.outputs.cache-primary-key }}
          REFS: ${{ github.ref }} refs/heads/${{ github.base_ref }} refs/heads/${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
          SELF_HOSTED: ${{ vars.SELF_HOSTED }}
        run: |
          retry="Re-run this check, or push again, once Build all's amd64 build_linux Build Deps job has succeeded."
          if [ -n "$SELF_HOSTED" ]; then
            echo "::error::No Linux deps cache matches this deps/ ($KEY). $retry"
            exit 1
          fi
          echo "No Linux deps cache matches this deps/ yet ($KEY). Waiting up to 90 minutes for Build all to save it."
          # Every 3 minutes, because all runs in the repository share one GITHUB_TOKEN rate limit.
          for _ in $(seq ${{ contains(github.event.head_commit.message, '[short]') && 3 || 30 }}); do
            # Read the run first: it only completes after its deps job saved the cache.
            build=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build_all.yml/runs?event=pull_request&head_sha=$HEAD_SHA" \
              --jq '.workflow_runs[0].status // ""' || true)
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$KEY" \
              --jq ".actions_caches[] | select(.key == \"$KEY\") | .ref" || true)
            for ref in $REFS; do
              if grep -qxF "$ref" <<< "$found"; then
                echo "Found it on $ref."
                exit 0
              fi
            done
            if [ "$build" = completed ]; then
              echo "::error::Build all has finished and the Linux deps cache ($KEY) is not there. Its amd64 build_linux Build Deps job failed, or the cache expired after 7 days unused. Re-run Build all, then this check, or push again."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Gave up after 90 minutes waiting for the Linux deps cache ($KEY). $retry"
          exit 1

      - name: Restore the deps cache Build all saved
        if: steps.changes.outputs.cpp == 'true' && steps.deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: ${{ steps.deps_cache.outputs.cache-primary-key }}
          fail-on-cache-miss: true

      - name: Show the restored deps
        if: steps.changes.outputs.cpp == 'true'
        run: cat deps/build/OrcaSlicer_dep/marker

  fake_deps_build:
    if: contains(github.event.head_commit.message, '[save]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'false'
      - id: key
        run: echo "key=linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}" >> "$GITHUB_OUTPUT"
      - run: |
          sleep 90
          mkdir -p deps/build/OrcaSlicer_dep
          echo "fake deps saved by run ${{ github.run_id }}" > deps/build/OrcaSlicer_dep/marker
      - uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: ${{ steps.key.outputs.key }}
