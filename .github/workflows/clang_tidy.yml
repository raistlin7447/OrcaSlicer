name: clang-tidy

# Runs clang-tidy, with the checks in .clang-tidy, over the C++ lines a pull
# request changes (scripts/clang_tidy_diff.py). The compile database is
# configured without the precompiled header, so code that only builds because
# the PCH supplied an include fails here.
#
# No paths filter: the job is a required check, and a workflow skipped by a
# paths filter leaves a required check pending forever. A PR with no C++
# changes skips the clang-tidy job instead, which passes the check.
on:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Parsing needs the deps cache built from this deps/, and only that one has
  # the right dependency headers, so there are no restore-keys. A prefix match
  # on this PR's ref would also win over the exact key on main. Until Build all
  # has saved that cache, the first attempt skips clang-tidy with a notice, and
  # clang_tidy_rerun.yml re-runs this workflow when Build all finishes. A later
  # attempt always runs clang-tidy, so it passes or fails.
  deps:
    name: Find the deps cache
    # The same runner as clang_tidy: the cache version depends on the path.
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      # To see whether Build all has finished for this commit.
      actions: read
    outputs:
      run: ${{ steps.changes.outputs.cpp == 'true' && steps.defer.outputs.deferred != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          # The PR merge commit plus its first parent, the base it is diffed against.
          fetch-depth: 2
          # Only deps/ is read from disk, for the cache key. The C++ check below
          # compares the two commits, which needs no files.
          sparse-checkout: deps
          filter: blob:none

      - name: Look for changed C++ files
        id: changes
        run: |
          if git -c core.quotePath=false diff --name-only HEAD^1 HEAD -- src tests | grep -qE '\.(cpp|cc|cxx|hpp|h|hxx)$'; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "No C++ changes under src/ or tests/."
          fi

      - name: Look up the deps cache
        id: deps_cache
        if: steps.changes.outputs.cpp == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}
          lookup-only: true

      # Only a Build all that has yet to finish can re-run this workflow. One
      # that waits for approval has not run yet.
      - name: Check that Build all has yet to finish
        id: build_all
        if: steps.changes.outputs.cpp == 'true' && steps.deps_cache.outputs.cache-hit != 'true' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build_all.yml/runs" -f event=pull_request \
            -f head_sha="$HEAD_SHA" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
          read -r status conclusion <<< "$run"
          if [ "$status" = completed ] && [ "$conclusion" != action_required ]; then
            echo "Build all has already finished for $HEAD_SHA ($conclusion), so clang-tidy runs now."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      # clang_tidy_rerun.yml finds the runs to re-run by this step's name.
      - name: Defer until Build all saves the deps cache
        id: defer
        if: steps.build_all.outputs.pending == 'true'
        env:
          KEY: ${{ steps.deps_cache.outputs.cache-primary-key }}
        run: |
          msg="Skipped clang-tidy: no Linux deps cache matches this deps/ yet ($KEY). Build all saves it in the x86_64 build_linux / Build Deps job, and this workflow re-runs by itself when Build all finishes. Until then, this skip does not mean clang-tidy passed."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "deferred=true" >> "$GITHUB_OUTPUT"

  clang_tidy:
    # Branch protection requires this check by name. Renaming the job disables
    # that gate.
    name: clang-tidy
    needs: deps
    # A skipped required check passes, so this also runs, and fails, when the
    # deps job did not succeed, including when it was cancelled.
    if: ${{ always() && (needs.deps.result != 'success' || needs.deps.outputs.run == 'true') }}
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
    steps:
      - name: Stop if the deps cache lookup failed
        if: needs.deps.result != 'success'
        run: |
          echo "::error::The Find the deps cache job did not succeed, so clang-tidy did not run."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          # The PR merge commit plus its first parent, the base it is diffed against.
          fetch-depth: 2

      - name: Restore cached deps
        id: deps_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      - name: Check the deps cache
        if: steps.deps_cache.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.deps_cache.outputs.cache-primary-key }}
        run: |
          echo "::error::No Linux deps cache matches this deps/ ($KEY). Build all saves it in the x86_64 build_linux / Build Deps job. If Build all has finished, that job failed or did not save the cache: re-run Build all, and this check re-runs after it."
          exit 1

      - name: Apt-Install Dependencies
        if: ${{ !vars.SELF_HOSTED }}
        uses: ./.github/actions/apt-install-deps

      - name: Install clang-tidy
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-tidy"
          "$RUNNER_TEMP/clang-tidy/bin/pip" install --quiet -r scripts/clang_tidy_requirements.txt

      # DEP_BUILD_DIR is named outright: CMake would otherwise derive it from the build
      # directory's name and look for the dependencies in deps/build-tidy.
      - name: Configure without the precompiled header
        run: >
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DSLIC3R_PCH=OFF -DORCA_TOOLS=ON -DBUILD_TESTS=ON
          -DDEP_BUILD_DIR=${{ github.workspace }}/deps/build

      # The one header the build generates rather than the configure.
      - name: Generate git_commit_hash.h
        run: cmake --build build-tidy --target git_commit_hash_header

      - name: Run clang-tidy on the changed lines
        run: >
          python3 scripts/clang_tidy_diff.py -p build-tidy --base HEAD^1
          --clang-tidy "$RUNNER_TEMP/clang-tidy/bin/clang-tidy" -j "$(nproc)"
